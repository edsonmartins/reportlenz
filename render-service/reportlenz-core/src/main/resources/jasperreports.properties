# Configuração do engine JasperReports no serviço de render (tarefa phase-1/1.2).
#
# Fonte default = DejaVu Sans (embarcada via jasperreports-fonts, com pdfEmbedded):
# garante acentuação pt-BR correta (R$, ç, ã) mesmo em template sem fontName
# explícito — as fontes PDF padrão (Helvetica) não embarcam glifos.
net.sf.jasperreports.default.font.name=DejaVu Sans

# ---------------------------------------------------------------------------
# ADR-021 — filtro de classes NATIVO do engine (segunda barreira, além do G7).
# Age no FILL, sobre o código já compilado das expressões: cobre JasperReport
# envenenado no compile cache compartilhado e eventual bypass do G7.
# Classe fora da whitelist → "Class X is not visible to reports".
net.sf.jasperreports.report.class.filter.enabled=true

# Whitelist do ReportLenz, SOMADA à padrão do engine (sufixo próprio). Espelha
# VerificadorDeExpressoes.TIPOS (G7) + classes de valor emitidas pelo jrxml-core
# (javaTypes.ts) + datasources Push + categorias de funções. Tipo novo no G7 →
# entra aqui também (o teste FiltroDeClassesTest falha se faltar).
net.sf.jasperreports.report.class.whitelist.reportlenz=\
	java.lang.String,java.lang.Math,java.lang.Integer,java.lang.Long,java.lang.Double,java.lang.Float,\
	java.lang.Short,java.lang.Byte,java.lang.Boolean,java.lang.Character,\
	java.math.RoundingMode,java.math.MathContext,\
	java.util.Objects,java.util.Collections,java.util.Date,\
	java.text.DecimalFormatSymbols,java.text.MessageFormat,\
	java.time.LocalDate,java.time.LocalDateTime,java.time.LocalTime,java.time.OffsetDateTime,\
	java.time.ZonedDateTime,java.time.Instant,java.time.ZoneId,java.time.ZoneOffset,java.time.Duration,\
	java.time.Period,java.time.format.DateTimeFormatter,java.time.temporal.ChronoUnit,java.time.temporal.Temporal,\
	net.sf.jasperreports.engine.data.JRMapCollectionDataSource,\
	net.sf.jasperreports.functions.standard.DateTimeFunctions,\
	net.sf.jasperreports.functions.standard.TextFunctions,\
	net.sf.jasperreports.functions.standard.MathFunctions,\
	net.sf.jasperreports.functions.standard.LogicalFunctions
