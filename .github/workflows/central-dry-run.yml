# Ensaio da publicação no Maven Central, SEM publicar (mesmo do archflow).
#
# Sobe o bundle, deixa o Central VALIDAR e para — descobre uma rejeição de
# validação (metadados, assinatura, namespace) sem gastar uma tag. Use antes da
# primeira publicação. O deployment fica em VALIDATED: descarte-o (Drop) em
# central.sonatype.com/publishing/deployments antes de publicar de verdade.
name: Central Dry Run

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a validar (sem o 'v'). Vazio = a versão dos POMs."
        required: false
        default: ""

jobs:
  validate:
    name: Validar no Central (sem publicar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.11'

      - name: Set POM version
        if: inputs.version != ''
        run: mvn -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B -Pmaven-central -Dgpg.skip=true clean install -DskipTests -pl reportlenz-core,reportlenz-spring-boot-starter -am

      - name: Import GPG key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          gpgconf --reload gpg-agent || true

      # O POM que sobe é o ACHATADO: deixá-lo no log é deliberado.
      - name: Mostrar o POM que será publicado
        run: |
          for m in reportlenz-core reportlenz-spring-boot-starter; do
            echo "::group::$m/.flattened-pom.xml"
            cat "$m/.flattened-pom.xml" || echo "(ainda não gerado)"
            echo "::endgroup::"
          done

      - name: Upload e validação (sem publicar)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -Pmaven-central -DskipTests \
            -Dreportlenz.publish.auto=false \
            -Dreportlenz.publish.waitUntil=validated \
            -pl reportlenz-core,reportlenz-spring-boot-starter \
            -s ../.maven-settings.xml.template

      - name: Lembrete
        run: |
          echo "Validado. O deployment está PARADO no portal, nada foi publicado."
          echo "Descarte-o (Drop) em https://central.sonatype.com/publishing/deployments"
          echo "antes de criar a tag da versão de verdade."
