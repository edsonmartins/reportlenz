# CI do ReportLenz — core (TS), designer (React), harness (Library 7.0.7) e render-service (Spring).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jrxml-core:
    name: jrxml-core · lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências (workspace)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir jrxml-core lint

      - name: Typecheck
        run: pnpm --dir jrxml-core typecheck

      - name: Testes (Vitest)
        run: pnpm --dir jrxml-core test

      - name: Build (ESM + d.ts)
        run: pnpm --dir jrxml-core build

      # RFC-001 §8 / I-7: o bundle não pode conter dependência de framework de UI.
      - name: Guardião headless (I-7)
        working-directory: jrxml-core
        run: |
          if grep -RInE "from ['\"](react|vue|@vue/)" dist/; then
            echo "::error::I-7 violado: import de framework de UI encontrado no bundle"
            exit 1
          fi
          echo "OK: bundle sem imports de UI"

  # Casca React do designer (ADR-005/RFC-004, Fase 2).
  jrxml-designer-react:
    name: designer · lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências (workspace)
        run: pnpm install --frozen-lockfile

      # O designer consome o core via workspace — build do core primeiro.
      - name: Build do jrxml-core
        run: pnpm --dir jrxml-core build

      - name: Lint
        run: pnpm --dir jrxml-designer-react lint

      - name: Typecheck
        run: pnpm --dir jrxml-designer-react typecheck

      - name: Testes (Vitest + Testing Library)
        run: pnpm --dir jrxml-designer-react test

      - name: Build (Vite)
        run: pnpm --dir jrxml-designer-react build

  # Gate G1 (ADR-013): JRXML emitido deve ser aceito pela Library 7.0.7 real.
  jr7-harness:
    name: harness · load+compile na Library 7.0.7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build do jrxml-core e emissão dos fixtures
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir jrxml-core build
          pnpm --dir jrxml-core emit:fixtures

      - name: Validar com a Library 7.0.7 (load + compile)
        working-directory: tools/jr7-harness
        run: mvn -q -B compile exec:java -Dexec.args="fixtures"

      # RFC-002 §7: record(s) Java gerados do contrato devem compilar de verdade.
      - name: Compilar records Java gerados (codegen 3.3)
        run: javac -d /tmp/reportlenz-records tools/jr7-harness/fixtures-java/*.java

  # Serviço de render (RFC-003): build + testes (incl. smoke da matriz JR7, nota 004).
  # A suíte roda DUAS vezes: SQLite (default zero-config) e PostgreSQL
  # (produção — ADR-009, change migracao-postgresql), com o MESMO SQL portável.
  # ADR-018 §6: fixtures do harness + MinIO presentes e NENHUM teste pulado.
  render-service:
    name: render-service · build + testes
    runs-on: ubuntu-latest
    env:
      # Imagem S3-compatível dos testes de storage. As imagens oficiais da MinIO
      # deixaram de ser publicadas (Docker Hub/quay); pgsty/minio aprovada em
      # 2026-11-26 (nota-010) — tag FIXA, atualize deliberadamente.
      MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: reportlenz
      MINIO_SECRET_KEY: reportlenz-ci-segredo
    services:
      # Fila do batch (tarefas 5.x) — em dev usa o Redis local/da infra (REDIS_HOST)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reportlenz
          POSTGRES_USER: reportlenz
          POSTGRES_PASSWORD: reportlenz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reportlenz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Fixtures do harness (ReferenciasDeQualidade, ContratoCruzado, Publish,
      # CicloDeVida, SegurancaDeExpressoes) — sem eles esses testes eram pulados.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Emitir fixtures do jrxml-core
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir jrxml-core build
          pnpm --dir jrxml-core emit:fixtures

      # services: do Actions não aceita o "command" (server /data) — docker run.
      - name: Subir MinIO (S3) para os testes de storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes no SQLite (default)
        working-directory: render-service
        run: mvn -q -B test

      - name: Nenhum teste pulado (SQLite)
        run: tools/ci/verificar-sem-skips.sh

      - name: Testes no PostgreSQL (produção)
        working-directory: render-service
        env:
          REPORTLENZ_DB_URL: jdbc:postgresql://localhost:5432/reportlenz
          REPORTLENZ_DB_USER: reportlenz
          REPORTLENZ_DB_PASSWORD: reportlenz
          REPORTLENZ_DB_POOL: "5"
        run: mvn -q -B test

      - name: Nenhum teste pulado (PostgreSQL)
        run: tools/ci/verificar-sem-skips.sh

      # ADR-026: o starter numa aplicação Spring Boot 4 com segurança, Flyway e
      # rotas PRÓPRIAS (exemplos/host-spring), instalado do repositório local
      # como viria do Maven Central — coexistência, cadeia de reserva, modo
      # "aplicacao", MotorReportLenz pela API Java e falha clara sem Redis.
      - name: Aplicação Spring hospedeira (starter embarcado)
        run: |
          mvn -q -B -f render-service/pom.xml install -DskipTests
          mvn -q -B -f exemplos/host-spring/pom.xml test

      - name: Nenhum teste pulado (aplicação hospedeira)
        run: tools/ci/verificar-sem-skips.sh exemplos/host-spring

  # E2E (change e2e-interface): sobe o ambiente de homologação inteiro
  # (deploy/docker-compose.homologacao.yml) com segredos ALEATÓRIOS e roda o
  # E2E da API (tokens reais do Keycloak) e o de interface (Playwright, login
  # real por popup). Usuários/clients de teste são temporários.
  e2e:
    name: e2e · API + interface (Playwright) no ambiente de homologação
    runs-on: ubuntu-latest
    needs: [render-service, jrxml-designer-react]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gerar deploy/.env com segredos aleatórios
        run: |
          r() { openssl rand -hex "$1"; }
          sed -e "s/troque-postgres/pg-$(r 8)/" -e "s/troque-redis/rd-$(r 8)/" \
              -e "s/troque-minio-segredo/mn-$(r 8)/" -e "s/troque-keycloak-admin/kc-$(r 8)/" \
              -e "s/troque-segredo-batch/bt-$(r 12)/" -e "s/troque-designer/Ds-$(r 6)/" \
              -e "s/troque-publicador/Pb-$(r 6)/" deploy/.env.exemplo > deploy/.env
          ! grep -E '=troque-' deploy/.env

      - name: Subir o ambiente (build das imagens + healthchecks)
        run: docker compose -f deploy/docker-compose.homologacao.yml --env-file deploy/.env up -d --build --wait --wait-timeout 600

      - name: E2E da API (tokens reais)
        run: deploy/e2e-homologacao.sh deploy/.env

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar Playwright (Chromium)
        run: |
          pnpm install --frozen-lockfile
          # A spec do catálogo importa os modelos/cenários do jrxml-core (ADR-022).
          pnpm --dir jrxml-core build
          pnpm --dir e2e exec playwright install --with-deps chromium

      # ADR-025: os pacotes empacotados (pnpm pack) instalados com npm numa aplicação
      # externa — o Playwright a serve (webServer) e testa dois designers + preview
      # falando com o serviço em outra origem (CORS).
      - name: Aplicação hospedeira de teste (tarballs dos pacotes)
        run: exemplos/host-react/preparar.sh

      - name: E2E de interface (Playwright)
        run: |
          set -a; . deploy/.env; set +a
          pnpm --dir e2e test

      - name: Relatório do Playwright (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Logs do ambiente (falha)
        if: failure()
        run: docker compose -f deploy/docker-compose.homologacao.yml --env-file deploy/.env logs --no-color --tail 300

      - name: Derrubar o ambiente
        if: always()
        run: docker compose -f deploy/docker-compose.homologacao.yml --env-file deploy/.env down -v
