# Release do ReportLenz — disparado por tag v<semver> (ex.: v0.1.0).
#
#   npm           @archbase/reportlenz-jrxml-core e @archbase/reportlenz-designer-react
#                 (mesmo processo do archbase-react e do linktor-webchat-sdk)
#   maven-central br.com.archbase:reportlenz-core e reportlenz-spring-boot-starter
#                 (mesmo processo do archflow)
#   github-release notas + links, depois dos dois
#
# A VERSÃO VEM DA TAG: package.json e pom.xml são ajustados no runner antes do
# build (como no archflow). Publicar é IRREVERSÍVEL nos dois registros — por isso
# os dois jobs recusam versão já publicada e rodam os testes antes.
#
# Segredos (Settings → Secrets → Actions), os mesmos nomes dos outros projetos:
#   NPM_TOKEN                 token que publica no escopo @archbase (o do archbase-react)
#   MAVEN_CENTRAL_USERNAME    usuário do token do central.sonatype.com (o do archflow)
#   MAVEN_CENTRAL_TOKEN       senha do mesmo token
#   GPG_PRIVATE_KEY           chave privada em base64 (a do archflow)
#   MAVEN_GPG_PASSPHRASE      passphrase da chave
# E o namespace br.com.archbase (o do Archbase) na conta do Central.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  npm:
    name: Publicar no npm (@archbase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar registry
        run: |
          rm -f .npmrc
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set @archbase:registry https://registry.npmjs.org/

      - name: Versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Versão no npm é imutável: uma segunda tentativa na mesma versão falha, e
      # isso lê como erro de build quando é a publicação anterior que deu certo.
      - name: Recusar se a versão já está no npm
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          JA=""
          for p in @archbase/reportlenz-jrxml-core @archbase/reportlenz-designer-react; do
            if npm view "$p@$V" version >/dev/null 2>&1; then JA="$JA $p"; fi
          done
          if [ -n "$JA" ]; then
            echo "::error title=Versão já publicada::$V já está no npm ($JA). Para corrigir algo, publique outra versão (tag nova)."
            exit 1
          fi
          echo "$V não está no npm: seguindo."

      - name: Versão dos pacotes a partir da tag
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          (cd jrxml-core && npm pkg set version="$V")
          (cd jrxml-designer-react && npm pkg set version="$V")

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Com testes: publicar é irreversível.
      - name: Build e testes
        run: |
          pnpm --dir jrxml-core lint && pnpm --dir jrxml-core test && pnpm --dir jrxml-core build
          pnpm --dir jrxml-designer-react lint && pnpm --dir jrxml-designer-react test && pnpm --dir jrxml-designer-react build:lib

      # Diagnóstico ANTES de publicar (lição do archbase-react): o npm devolve
      # E404 no PUT em vez de 403 para quem não tem escrita no escopo. Nenhum
      # comando aqui falha o job, e o token não aparece na saída.
      - name: Diagnóstico de autenticação no npm
        run: |
          echo "== NODE_AUTH_TOKEN definido: $([ -n "$NODE_AUTH_TOKEN" ] && echo sim || echo NAO)"
          echo "== whoami:"
          npm whoami --registry=https://registry.npmjs.org || echo ">>> whoami FALHOU — o NPM_TOKEN não autentica"
          echo "== pacotes que este token alcança em @archbase:"
          npm access list packages @archbase 2>&1 | head -5 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -r publica só os pacotes não privados, em ordem topológica (o core antes
      # do designer, que depende dele: workspace:^ vira ^<versão>).
      - name: Publish to NPM
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven-central:
    name: Publicar no Maven Central (br.com.archbase)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # A aplicação Spring hospedeira (teste do starter) sobe com o batch ligado.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: render-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Maven 3.9 FIXO (lição do archflow, v1.5.0): o Maven 3.10 da imagem do
      # runner grava metadados locais no staging do central-publishing-maven-plugin
      # e o Central recusa o bundle. Ver mavenplugins/central-publishing-maven-plugin#79.
      - name: Set up Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.11'

      - name: Maven em uso
        run: mvn -v

      - name: Versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Versão dos POMs a partir da tag
        run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.VERSION }}" -DgenerateBackupPoms=false

      # Versão no Central é imutável (archflow, 1.4.0: a reexecução de um release
      # que já tinha publicado trouxe "being published in another deployment").
      - name: Recusar se a versão já está no Central
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          JA=""
          for a in reportlenz-core reportlenz-spring-boot-starter; do
            URL="https://repo1.maven.org/maven2/br/com/archbase/$a/$V/$a-$V.pom"
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$URL")" = "200" ]; then JA="$JA $a"; fi
          done
          if [ -n "$JA" ]; then
            echo "::error title=Versão já publicada::$V já está no Maven Central ($JA). Para corrigir algo, publique outra versão (tag nova)."
            exit 1
          fi
          echo "$V não está no Central: seguindo."

      # Com testes, de propósito: núcleo (146) e o starter numa aplicação Spring
      # hospedeira (exemplos/host-spring) contra os artefatos ACHATADOS — o que o
      # consumidor do Central de fato recebe. A suíte inteira do serviço (Redis,
      # PostgreSQL, MinIO) roda no CI da tag.
      - name: Build e testes
        run: |
          mvn -B -Pmaven-central -Dgpg.skip=true clean install -pl reportlenz-core,reportlenz-spring-boot-starter -am
          mvn -B -f ../exemplos/host-spring/pom.xml test -Dreportlenz.version="${{ steps.version.outputs.VERSION }}"

      - name: Import GPG key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          gpgconf --reload gpg-agent || true

      # Duas barreiras contra publicar o módulo errado: -pl aqui e o opt-in
      # reportlenz.publish.skip (true por padrão; false só nos dois publicados).
      - name: Deploy to Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -Pmaven-central -DskipTests \
            -pl reportlenz-core,reportlenz-spring-boot-starter \
            -s ../.maven-settings.xml.template

      # "Workflow verde" = bundle VALIDADO; a publicação segue no Sonatype e a
      # propagação para o repo1 leva o tempo dela.
      - name: Onde acompanhar a publicação
        if: success()
        run: |
          echo "::notice title=Publicação enviada::Bundle validado e publicando."
          echo "Acompanhe em https://central.sonatype.com/publishing/deployments"
          for a in reportlenz-core reportlenz-spring-boot-starter; do
            echo "  https://repo1.maven.org/maven2/br/com/archbase/$a/${{ steps.version.outputs.VERSION }}/"
          done

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [npm, maven-central]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notas
        run: |
          V="${GITHUB_REF_NAME#v}"
          git fetch --tags --force 2>/dev/null || true
          ANTERIOR=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "## ReportLenz ${GITHUB_REF_NAME}"
            echo
            if [ -n "$ANTERIOR" ]; then
              echo "### Mudanças desde $ANTERIOR"
              git log "${ANTERIOR}..${GITHUB_REF_NAME}" --no-merges --pretty=format:"- %s" | head -100
              echo
            fi
            echo
            echo "### Pacotes"
            echo
            echo '```bash'
            echo "npm install @archbase/reportlenz-designer-react@$V @archbase/reportlenz-jrxml-core@$V"
            echo '```'
            echo
            echo '```xml'
            echo "<dependency>"
            echo "  <groupId>br.com.archbase</groupId>"
            echo "  <artifactId>reportlenz-spring-boot-starter</artifactId>"
            echo "  <version>$V</version>"
            echo "</dependency>"
            echo '```'
          } > notas.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas.md
          draft: false
          prerelease: false
