# Release (ADR-025 §5, ADR-026 §4): disparado por tag v<semver> (ex.: v0.1.0) —
# pacotes npm (job npm) e artefatos Maven (job maven), mesma versão.
# Pré-requisitos (do dono do repositório):
#   - organização @reportlenz no npmjs.com;
#   - segredo NPM_TOKEN (token de automação com permissão de publicar em @reportlenz).
# A versão da tag precisa ser a dos dois package.json — o job confere antes de publicar.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance (atestado de origem do build)

jobs:
  npm:
    name: publicar @reportlenz/jrxml-core e @reportlenz/designer-react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Conferir versão da tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in jrxml-core jrxml-designer-react; do
            V=$(node -p "require('./$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "::error::$p está em $V, tag é $TAG"; exit 1; }
          done

      - name: Conferir segredo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: '[ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::defina o segredo NPM_TOKEN (ADR-025 §5)"; exit 1; }'

      - name: Build e testes
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir jrxml-core lint && pnpm --dir jrxml-core test && pnpm --dir jrxml-core build
          pnpm --dir jrxml-designer-react lint && pnpm --dir jrxml-designer-react test && pnpm --dir jrxml-designer-react build:lib

      - name: Publicar (core antes do designer, que depende dele)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --dir jrxml-core publish --no-git-checks
          pnpm --dir jrxml-designer-react publish --no-git-checks

  # Maven Central (ADR-026 §4): reportlenz-parent, reportlenz-core e
  # reportlenz-spring-boot-starter. Pré-requisitos (do dono do repositório):
  #   - namespace do groupId VERIFICADO no central.sonatype.com (hoje dev.reportlenz →
  #     domínio reportlenz.dev; alternativa io.github.<dono>);
  #   - segredos CENTRAL_USERNAME/CENTRAL_TOKEN (token de usuário do Central)
  #     e GPG_PRIVATE_KEY/GPG_PASSPHRASE (chave publicada num keyserver).
  # A tag deve apontar para um commit do main com o CI verde (a suíte completa
  # exige Redis/PostgreSQL/MinIO e roda lá).
  maven:
    name: publicar reportlenz-core e reportlenz-spring-boot-starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$CENTRAL_USERNAME" ] || { echo "::error::defina CENTRAL_USERNAME/CENTRAL_TOKEN (ADR-026 §4)"; exit 1; }
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::defina GPG_PRIVATE_KEY/GPG_PASSPHRASE (ADR-026 §4)"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Conferir versão da tag
        working-directory: render-service
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          [ "$V" = "$TAG" ] || { echo "::error::render-service está em $V, tag é $TAG"; exit 1; }

      - name: Testes do núcleo e publicação
        working-directory: render-service
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -pl reportlenz-core test
          mvn -B -P publicacao -DskipTests deploy
