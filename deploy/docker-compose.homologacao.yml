# Ambiente de homologação do ReportLenz (ADR-019).
#   cp deploy/.env.exemplo deploy/.env   # e troque os segredos
#   docker compose -f deploy/docker-compose.homologacao.yml --env-file deploy/.env up -d --build
# Expostos ao host: designer (8080) e Keycloak (8180). O resto fica na rede interna.

name: reportlenz-homolog


services:
  postgres:
    image: reportlenz-postgres:homolog
    build: ./postgres
    environment:
      POSTGRES_DB: reportlenz
      POSTGRES_USER: ${POSTGRES_USER:?defina no deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d reportlenz"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina no deploy/.env}", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: ${MINIO_IMAGE:?defina no deploy/.env}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?defina no deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?defina no deploy/.env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || mc ready local >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: reportlenz-keycloak:homolog
    build: ./keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL_PUBLICA:?defina no deploy/.env}
      # Backchannel dinâmico: o render-service busca as chaves por http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina no deploy/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina no deploy/.env}
      # Placeholders do realm importado
      DESIGNER_URL: ${DESIGNER_URL:?defina no deploy/.env}
      REPORTLENZ_BATCH_CLIENT_SECRET: ${REPORTLENZ_BATCH_CLIENT_SECRET:?defina no deploy/.env}
      HOMOLOG_SENHA_DESIGNER: ${HOMOLOG_SENHA_DESIGNER:?defina no deploy/.env}
      HOMOLOG_SENHA_PUBLICADOR: ${HOMOLOG_SENHA_PUBLICADOR:?defina no deploy/.env}
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl: HTTP cru na porta de management (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  render-service:
    image: reportlenz-render:homolog
    build: ../render-service
    environment:
      REPORTLENZ_DB_URL: jdbc:postgresql://postgres:5432/reportlenz
      REPORTLENZ_DB_USER: ${POSTGRES_USER}
      REPORTLENZ_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REPORTLENZ_DB_POOL: "10"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REPORTLENZ_STORAGE_PROVIDER: MINIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REPORTLENZ_OIDC_ISSUER: ${KEYCLOAK_URL_PUBLICA}/realms/reportlenz
      REPORTLENZ_OIDC_JWK_SET_URI: http://keycloak:8080/realms/reportlenz/protocol/openid-connect/certs
      REPORTLENZ_OIDC_CLIENT_ID: reportlenz
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      REPORTLENZ_RECURSOS_URLS_PERMITIDAS: ${REPORTLENZ_RECURSOS_URLS_PERMITIDAS:-}
      OTEL_SAMPLING: ${OTEL_SAMPLING:-0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
    volumes:
      - render-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  designer:
    image: reportlenz-designer:homolog
    build:
      context: ..
      dockerfile: jrxml-designer-react/Dockerfile
    environment:
      RENDER_SERVICE_URL: http://render-service:8087
      OIDC_AUTHORITY: ${KEYCLOAK_URL_PUBLICA}/realms/reportlenz
      OIDC_CLIENT_ID: reportlenz
      OIDC_ORIGEM: ${KEYCLOAK_URL_PUBLICA}
    ports:
      - "8080:8080"
    depends_on:
      render-service:
        condition: service_healthy

volumes:
  postgres:
  redis:
  minio:
  render-data:
